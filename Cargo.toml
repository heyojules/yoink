[package]
name = "yoink"
description = "A tiny macOS screenshot tool: select, save, and copy to the clipboard."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
global-hotkey = "0.9.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSURL"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# A panic would otherwise leave the daemon alive with its hotkey stuck; abort lets launchd restart it.
panic = "abort"
